# ─── Rebuild Docker Compose ────────────────────────────────
# Production-ready deployment: PostgreSQL + Backend + Frontend

services:
  # ─── Database ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rebuild
      POSTGRES_USER: rebuild
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rebuild_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rebuild"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Backend (FastAPI) ───────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      DATABASE_URL: postgresql://rebuild:${DB_PASSWORD:-rebuild_secret}@postgres:5432/rebuild
      DEBUG: "false"
    ports:
      - "18080:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # ─── Frontend (Next.js) ──────────────────────────────────
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:18080
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
