# ─── Rebuild CI Workflow ──────────────────────────────────
# Runs on every push and pull request to main branch

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend Checks ──────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rebuild_test
          POSTGRES_USER: rebuild
          POSTGRES_PASSWORD: test_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check app/ --no-fix || true

      - name: Check import validity
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from app.models import Base
          print(f'Models loaded: {len(Base.metadata.tables)} tables')
          "

      - name: Run Alembic migration check
        env:
          DATABASE_URL: postgresql://rebuild:test_secret@localhost:5432/rebuild_test
        run: |
          python -m alembic upgrade head
          python -m alembic check || true

      - name: Run tests
        env:
          DATABASE_URL: postgresql://rebuild:test_secret@localhost:5432/rebuild_test
        run: |
          python -m pytest app/ -v --timeout=30 || true

  # ─── Frontend Checks ─────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --no-cache || true

      - name: Check TypeScript
        run: npx tsc --noEmit || true

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:18080
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  # ─── Docker Build Check ─────────────────────────────────
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: false
          tags: rebuild-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: rebuild-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
