<article>
<h2>Soy (Closure Template) mode</h2>
<form><textarea id="code" name="code">
{namespace example}

/**
 * Says hello to the world.
 */
{template .helloWorld}
  {@param name: string}
  {@param? score: number}
  Hello &lt;b&gt;{$name}&lt;/b&gt;!
  &lt;div&gt;
    {if $score}
      &lt;em&gt;{$score} points&lt;/em&gt;
    {else}
      no score
    {/if}
  &lt;/div&gt;
{/template}

{template .alertHelloWorld kind="js"}
  alert('Hello World');
{/template}
</textarea></form>
<script>
      var editor = CodeMirror.fromTextArea(document.getElementById("code"), {
        lineNumbers: true,
        matchBrackets: true,
        mode: "text/x-soy",
        indentUnit: 2,
        indentWithTabs: false
      });
    </script>
<p>A mode for <a href="https://developers.google.com/closure/templates/">Closure Templates</a> (Soy).</p>
<p><strong>MIME type defined:</strong> <code>text/x-soy</code>.</p>
