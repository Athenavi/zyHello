<html>
<head>
{%- include "/_include/header.html" -%}
<title>[[${appName}]]</title>
<style>
      .frame-wrap,
      .frame-wrap iframe {
        padding: 0 !important;
        margin: 0 !important;
        width: 100%;
        height: 100%;
        min-height: 100%;
        line-height: 1;
        font-size: 0;
      }
    </style>
</head>
<body>
<div class="['rb-wrapper', 'rb-fixed-sidebar', 'rb-collapsible-sidebar', 'rb-collapsible-sidebar-hide-logo'] {{ sideCollapsedClazz }}">
{%- include "/_include/nav-top.html" -%}
{%- include "/_include/nav-left.html" -%}
<div class="rb-loading rb-loading-active must-center">
{%- include "/_include/spinner.html" -%}
</div>
<div class="rb-content">
<div class="main-content container-fluid frame-wrap">
<iframe class="hide" frameborder="0" height="100%" scrolling="yes" width="100%"></iframe>
</div>
</div>
</div>
{%- include "/_include/footer.html" -%}
{%- include "/_include/forms.html" -%}
<script>
      $(document).ready(() => {
        const $frame = $('.frame-wrap iframe')
        const url = $urlp('url') || $urlp('src')
        $frame.attr('src', $decode(url))

        $addResizeHandler(() => {
          $frame.css({ minHeight: $(window).height() - 61 })
        })()
        setTimeout(() => {
          $frame.removeClass('hide')
          $('.rb-loading-active').remove()
        }, 1000)
      })
    </script>
</body>
</html>
