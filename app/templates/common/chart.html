<html>
<head>
{%- include "/_include/header.html" -%}
<title>[[${title ?:'REBUILD'}]]</title>
<link href="{{ '/' ~ assets ~ '/' ~ css ~ '/' ~ charts.css }}" rel="stylesheet" type="text/css">
<style>
      html,
      body,
      .main-content,
      .chart-wrap {
        background-color: #fff;
        height: 100%;
        overflow: hidden;
      }
      .main-content,
      .chart-wrap {
        min-height: 500px;
      }
      .chart-box {
        padding: 0;
      }
      .chart-box .chart-head {
        visibility: hidden;
      }
      .chart-box.TABLE .chart-head {
        display: none;
      }
      .chart-box.TABLE .chart-body {
        padding: 0;
        margin: 10px 10px 0;
        margin: 0;
      }
      .chart.ctable {
        margin: 0;
        padding: 0;
      }
    </style>
</head>
<body>
<div class="main-content m-0 p-0">
<div class="chart-wrap"></div>
</div>
{%- include "/_include/footer.html" -%}
<script src="{{ '/' ~ assets ~ '/' ~ lib ~ '/' ~ charts ~ '/' ~ echarts.min.js ~ '?' ~ v ~ '=5.5.0' }}"></script>
<script src="{{ '/' ~ assets ~ '/' ~ lib ~ '/' ~ charts ~ '/' ~ tablecellsselection.js }}"></script>
<script src="{{ '/' ~ assets ~ '/' ~ js ~ '/' ~ charts ~ '/' ~ charts.mapstyle.js }}" type="text/babel"></script>
<script src="{{ '/' ~ assets ~ '/' ~ js ~ '/' ~ charts ~ '/' ~ charts.js }}" type="text/babel"></script>
<script>
      window.__PageConfig = {
        chartId: '[[${chartId}]]',
        chartConfig: [(${chartConfig ?:'null'})],
        chartFilter: [(${chartFilter ?:'null'})],
      }
    </script>
<script type="text/babel">
      const wpc = window.__PageConfig
      // if (window.frameElement) $(window.frameElement).parents('.modal-content').find('.modal-title').text(wpc.chartConfig.title)
      $(document).ready(() => {
        const conf = $clone(wpc.chartConfig)
        conf.extconfig = { chart_filter: wpc.chartFilter }
        conf.editable = false
        renderRbcomp(detectChart(conf, wpc.chartId), $('.chart-wrap'))
      })
    </script>
</body>
</html>
