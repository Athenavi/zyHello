<html>
<head>
{%- include "/_include/header.html" -%}
<meta content="https://getrebuild.com/docs/admin/users#%E7%AE%A1%E7%90%86%E5%9B%A2%E9%98%9F" name="page-help">
<title>[[${bundle.L('团队管理')}]]</title>
</head>
<body>
<div class="['rb-wrapper', 'rb-fixed-sidebar', 'rb-collapsible-sidebar', 'rb-collapsible-sidebar-hide-logo', 'rb-color-header'] {{ sideCollapsedClazz }}">
{%- include "/_include/nav-top.html" -%}
{%- include "/_include/nav-left-admin.html" -%}
<div class="rb-content">
<div class="main-content container-fluid">
<div class="card card-table card-topcolor">
<div class="card-body">
<div class="dataTables_wrapper container-fluid">
<div class="row rb-datatable-header">
<div class="col-12 col-lg-6">
<div class="dataTables_filter">
<div class="input-group input-search">
<input class="form-control" placeholder="{{ bundle.L('快速查询') }}" type="text">
<span class="input-group-btn">
<button class="btn btn-secondary" type="button"><i class="icon zmdi zmdi-search"></i></button>
</span>
</div>
</div>
</div>
<div class="col-12 col-lg-6">
<div class="dataTables_oper">
<button class="btn btn-space btn-secondary J_view" disabled="disabled" type="button"><i class="icon mdi mdi-folder-open"></i> [[${bundle.L('打开')}]]</button>
<button class="btn btn-primary btn-space J_new" type="button"><i class="icon mdi mdi-briefcase-plus"></i> [[${bundle.L('新建团队')}]]</button>
<div class="btn-group btn-space">
<button class="btn btn-secondary dropdown-toggle" data-toggle="dropdown" type="button">[[${bundle.L('更多')}]] <i class="icon zmdi zmdi-more-vert"></i></button>
<div class="dropdown-menu dropdown-menu-right">
<a class="dropdown-item J_columns"><i class="icon mdi mdi-view-column-outline"></i> [[${bundle.L('列显示')}]]</a>
</div>
</div>
</div>
</div>
</div>
<div class="rb-loading rb-loading-active data-list" id="react-list">
{%- include "/_include/spinner.html" -%}
</div>
</div>
</div>
</div>
</div>
</div>
</div>
{%- include "/_include/footer.html" -%}
<script>
      window.__PageConfig = {
        type: 'RecordList',
        entity: ['[[${entityName}]]', '[[${entityLabel}]]', '[[${entityIcon}]]'],
        privileges: [(${entityPrivileges})],
        listConfig: [(${DataListConfig})],
        advFilter: false,
      }
    </script>
{%- include "/_include/forms.html" -%}
<script src="{{ '/' ~ assets ~ '/' ~ js ~ '/' ~ general ~ '/' ~ rb ~ '-' ~ datalist.js }}" type="text/babel"></script>
</body>
</html>
