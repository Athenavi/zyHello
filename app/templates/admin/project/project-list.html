<html>
<head>
{%- include "/_include/header.html" -%}
<meta content="https://getrebuild.com/docs/admin/projects" name="page-help">
<title>[[${bundle.L('项目管理')}]]</title>
<style>
      .project-icon > .icon,
      .card-body > .icon {
        font-size: 26px;
        color: #555;
        display: inline-block;
        text-align: center;
        border-radius: 2px;
      }
      .project-icon > .icon {
        width: 36px;
        height: 36px;
        line-height: 36px;
        background-color: #e3e3e3;
      }
      .project-icon:hover {
        opacity: 0.8;
      }
      .card-body {
        position: relative;
      }
      .card-body > .icon {
        position: absolute;
        right: 15px;
        top: 9px;
        color: #eee;
        font-size: 48px;
      }
    </style>
</head>
<body>
<div class="['rb-wrapper', 'rb-fixed-sidebar', 'rb-collapsible-sidebar', 'rb-collapsible-sidebar-hide-logo', 'rb-color-header'] {{ sideCollapsedClazz }}">
{%- include "/_include/nav-top.html" -%}
{%- include "/_include/nav-left-admin.html" -%}
<div class="rb-content">
<div class="page-head">
<div class="float-left"><div class="page-head-title">[[${bundle.L('项目管理')}]]</div></div>
<div class="float-right pt-1">
<button class="btn btn-primary J_add" type="button"><i class="icon zmdi zmdi-plus"></i> [[${bundle.L('添加')}]]</button>
</div>
<div class="clearfix"></div>
</div>
<div class="main-content container-fluid pt-0" id="list">
<div class="card ph">
<div class="card-body">
<div class="ph-item">
<div class="ph-col-12">
<div class="ph-row">
<div class="ph-col-8"></div>
<div class="ph-col-4 empty"></div>
<div class="ph-col-12"></div>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
{%- include "/_include/footer.html" -%}
<script src="{{ '/' ~ assets ~ '/' ~ js ~ '/' ~ project ~ '/' ~ project ~ '-' ~ list.js }}" type="text/babel"></script>
</body>
</html>
