<html>
<head>
{%- include "/_include/header.html" -%}
<meta content="https://getrebuild.com/docs/admin/auditing#%E5%9B%9E%E6%94%B6%E7%AB%99" name="page-help">
<title>[[${bundle.L('回收站')}]]</title>
</head>
<body>
<div class="['rb-wrapper', 'rb-fixed-sidebar', 'rb-collapsible-sidebar', 'rb-collapsible-sidebar-hide-logo', 'rb-color-header'] {{ sideCollapsedClazz }}">
{%- include "/_include/nav-top.html" -%}
{%- include "/_include/nav-left-admin.html" -%}
<div class="rb-content">
<div class="main-content container-fluid">
<div class="card card-table card-topcolor">
<div class="card-body">
<div class="dataTables_wrapper container-fluid">
<div class="row rb-datatable-header">
<div class="col-12 col-md-6">
<div class="dataTables_filter">
<div class="float-left mr-2 select2-sm">
<div style="width: 212px; margin-bottom: 5px">
<select class="form-control form-control-sm" id="belongEntity">
<option value="$ALL$">[[${bundle.L('全部实体')}]]</option>
</select>
</div>
</div>
<div class="input-group input-search">
<input class="form-control" data-quickfields="recordId,recordName" placeholder="{{ bundle.L('快速查询') }}" type="text">
<span class="input-group-btn">
<button class="btn btn-secondary" type="button"><i class="icon zmdi zmdi-search"></i></button>
</span>
</div>
</div>
</div>
<div class="col-12 col-md-6">
<div class="dataTables_oper">
<button class="btn btn-space btn-secondary J_details" type="button"><i class="icon mdi mdi-text-box-search-outline"></i> [[${bundle.L('详情')}]]</button>
<button class="btn btn-space btn-outline btn-danger J_restore" type="button"><i class="icon zmdi zmdi-time-restore"></i> [[${bundle.L('恢复')}]]</button>
</div>
</div>
</div>
<div class="rb-loading rb-loading-active data-list" id="react-list">
{%- include "/_include/spinner.html" -%}
</div>
</div>
</div>
</div>
</div>
</div>
</div>
{%- include "/_include/footer.html" -%}
<script src="{{ '/' ~ assets ~ '/' ~ js ~ '/' ~ general ~ '/' ~ rb ~ '-' ~ datalist.common.js }}" type="text/babel"></script>
<script src="{{ '/' ~ assets ~ '/' ~ js ~ '/' ~ general ~ '/' ~ rb ~ '-' ~ datalist.js }}" type="text/babel"></script>
<script src="{{ '/' ~ assets ~ '/' ~ js ~ '/' ~ admin ~ '/' ~ recycle ~ '-' ~ bin.js }}" type="text/babel"></script>
<script src="{{ '/' ~ assets ~ '/' ~ lib ~ '/' ~ clipboard.min.js }}"></script>
</body>
</html>
