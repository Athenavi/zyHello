<html>
<head>
{%- include "/_include/header.html" -%}
<link href="{{ '/' ~ assets ~ '/' ~ css ~ '/' ~ view ~ '-' ~ page.css }}" rel="stylesheet" type="text/css">
<link href="{{ '/' ~ assets ~ '/' ~ css ~ '/' ~ feeds.css }}" rel="stylesheet" type="text/css">
<link href="{{ '/' ~ assets ~ '/' ~ css ~ '/' ~ task ~ '-' ~ view.css }}" rel="stylesheet" type="text/css">
<title>[[${bundle.L('任务详情')}]]</title>
</head>
<body class="['view-body'] {{ 'readonly' if not isMember else '' }}">
<div class="view-header">
<i class="['header-icon', 'zmdi'] {{ 'zmdi-' ~ projectIcon }}"></i>
<h3 class="title">[[${bundle.L('任务详情')}]]</h3>
<span>
<a class="close J_close" title="{{ bundle.L('关闭') }}"><i class="zmdi zmdi-close"></i></a>
<a class="close sm J_reload" title="{{ bundle.L('刷新') }}"><i class="zmdi zmdi-refresh"></i></a>
</span>
</div>
<div class="main-content container-fluid">
<div id="task-contents"></div>
</div>
<div id="task-comment"></div>
{%- include "/_include/footer.html" -%}
<script>
      window.__PageConfig = {
        type: 'TaskView',
        taskId: '[[${id}]]',
        isMember: '[[${isMember}]]' === 'true',
        projectStatus: [[${projectStatus}]],
      }
    </script>
<script src="{{ '/' ~ assets ~ '/' ~ js ~ '/' ~ project ~ '/' ~ task ~ '-' ~ view.js }}" type="text/babel"></script>
{%- include "/_include/forms.html" -%}
</body>
</html>
